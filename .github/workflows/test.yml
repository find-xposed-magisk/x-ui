name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # The panel is long-lived and shares state between goroutines, so a data
      # race is a real class of bug here rather than a theoretical one.
      - name: Test with the race detector
        run: go test -race ./... -count=1

      # go.mod and go.sum must already be in the state `go mod tidy` produces,
      # or a dependency change silently drifts from what is committed.
      - name: Check go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak > /dev/null || ! diff -q go.sum go.sum.bak > /dev/null; then
            echo "go.mod or go.sum is not tidy; run: go mod tidy"
            diff go.mod.bak go.mod || true
            diff go.sum.bak go.sum || true
            rm -f go.mod.bak go.sum.bak
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm, goarm: "5" }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The release workflow only runs on a tag, so without this a change that
      # breaks one architecture is not noticed until release day.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build ./...
